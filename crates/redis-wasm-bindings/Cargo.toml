[package]
name = "redis-wasm-bindings"
version = { workspace = true }
edition = "2021"
description = "WASM bindings for redis-wasm-core using wasm-bindgen"
license = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redis-wasm-core = { path = "../redis-wasm-core" }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "BroadcastChannel"] }
wasm-bindgen-futures = { workspace = true }
indexed-db = { workspace = true }
console_error_panic_hook = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
crossbeam = "0.8"
futures = "0.3"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = []