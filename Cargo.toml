[workspace]
members = [
    "crates/redis-wasm-core",
    "crates/redis-wasm-bindings",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Redis WASM Contributors"]
description = "Redis-like in-memory database for browsers via WebAssembly"
repository = "https://github.com/yourorg/redis-wasm"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
dashmap = "5.5"
thiserror = "1.0"
tracing = "0.1"
regex = "1.10"
async-trait = "0.1"
parking_lot = "0.12"
ordered-float = { version = "3.0", features = ["serde"] }

# Async (for native tests)
tokio = { version = "1.38", features = ["sync", "time", "macros", "rt-multi-thread"] }

# WASM-specific
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "EventTarget", "MessageEvent", "Blob", "Url", "DomException"] }
wasm-bindgen-futures = "0.4"
indexed-db = "0.5.0-alpha.1"
console_error_panic_hook = "0.1"

# Testing
criterion = "0.5"
wasm-bindgen-test = "0.3"